name: LocalLLMChat
options:
  bundleIdPrefix: com.vesco
  deploymentTarget:
    iOS: "26.0"

# Pinned to exact revisions: these packages publish no tags on `main`, and an
# unpinned branch makes builds unreproducible.
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 702e5a0eaf990e1f6d3db2b6e7d8872858a44055
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    revision: 8ce22b4c138d75395934485be9b198850acaace8
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    revision: eec09bdffb04a6f13eaed57c7b4acca3f6729a6c

targets:
  LocalLLMChat:
    type: application
    platform: iOS
    sources: [LocalLLMChat]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vesco.LocalLLMChatBot-5555
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Requires local network access to find Ollama."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos to a conversation."
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
      SWIFT_VERSION: "5.0"
      # Required by the swift-syntax macro plugin behind #huggingFaceLoadModelContainer.
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub

  LocalLLMChatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.0"
    dependencies:
      - target: LocalLLMChat

schemes:
  LocalLLMChat:
    build:
      targets:
        LocalLLMChat: all
        LocalLLMChatTests: [test]
    test:
      targets: [LocalLLMChatTests]
